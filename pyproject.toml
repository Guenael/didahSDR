[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "didahsdr"
version = "0.1.0"
description = "High-performance CW Web-SDR with real-time client-side DSP and horizontal waterfall"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.scripts]
didahsdr = "server.replay_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.black]
line-length = 120
target-version = ["py310"]
