name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (ruff, black, pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check server tests
      - run: black -l 120 --check server tests
      - run: pytest --cov=server --cov-report=term-missing

  js:
    name: JavaScript (eslint, node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/js/*.test.js

  docker:
    name: Container image (build and smoke run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: docker build -t didahsdr:ci .
      - name: Synthetic IQ recording (none is shipped)
        run: |
          pip install pytest
          mkdir -p ci-samples
          python -c "from pathlib import Path; from tests.conftest import write_iq_wav; write_iq_wav(Path('ci-samples/synth.wav'), bytes(96000 * 4))"
      - name: Run and probe
        run: |
          docker run -d --name didah -p 9000:9000 -v "$PWD/ci-samples:/home/app/samples:ro" didahsdr:ci \
            --wav /home/app/samples/synth.wav --center-freq 7048000
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:9000/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:9000/
          curl -fsS -o /dev/null http://localhost:9000/js/app.js
          curl -fsS -o /dev/null http://localhost:9000/lib/ort.wasm.min.js
          curl -fsSI http://localhost:9000/ | grep -i "cross-origin-embedder-policy: require-corp"
      - name: Container logs
        if: always()
        run: docker logs didah || true
