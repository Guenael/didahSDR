name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  packages:
    name: Linux AppImage and Windows zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: CW decoder runtime
        run: bash scripts/fetch_ort.sh

      - name: Desktop tooling
        working-directory: desktop
        run: npm ci

      # Artifact names and the in-app title follow the tag 
      - name: Version from tag
        working-directory: desktop
        run: |
          ver="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$ver"
          python3 - "$ver" << 'PY'
          import re, sys
          from pathlib import Path
          ver = sys.argv[1]
          path = Path("../app/index.html")
          text = path.read_text()
          new, n = re.subn(r"(— v)[0-9]+\.[0-9]+\.[0-9]+", r"\g<1>" + ver, text)
          if n != 2:
              raise SystemExit(f"expected 2 version strings in index.html, found {n}")
          path.write_text(new)
          PY

      - name: Linux AppImage
        working-directory: desktop
        run: npx electron-builder --linux AppImage

      - name: Windows zip
        working-directory: desktop
        run: npx electron-builder --win zip

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          files=(desktop/dist/*.AppImage desktop/dist/*-win.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
